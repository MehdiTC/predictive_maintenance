  <text x="99" y="199" text-anchor="end" fill="#77756f" font-family="system-ui, sans-serif" font-size="12">16</text>

  <rect x="198" y="294" width="78" height="196" rx="7" fill="#45b8a0"/>
  <rect x="286" y="234" width="78" height="256" rx="7" fill="#6259c9"/>
  <text x="237" y="284" text-anchor="middle" fill="#116652" font-family="system-ui, sans-serif" font-size="14" font-weight="700">10.62</text>
  <text x="325" y="224" text-anchor="middle" fill="#40379b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">13.83</text>

  <rect x="438" y="295" width="78" height="195" rx="7" fill="#45b8a0"/>
  <rect x="526" y="232" width="78" height="258" rx="7" fill="#6259c9"/>
