  <text x="982" y="424" fill="#917467" font-family="system-ui, sans-serif" font-size="11">first critical signal</text>

  <rect x="738" y="461" width="420" height="101" rx="14" fill="#f3f2ef" stroke="#cfcdc7"/>
  <text x="760" y="494" fill="#4d4b46" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OFFICIAL NASA BENCHMARK</text>
  <text x="760" y="530" fill="#242321" font-family="system-ui, sans-serif" font-size="28" font-weight="750">14.41 cycles RMSE</text>
  <text x="760" y="551" fill="#77756f" font-family="system-ui, sans-serif" font-size="12">one final row per engine</text>

  <text x="52" y="604" fill="#77756f" font-family="system-ui, sans-serif" font-size="12">Held-out replay: 10 engines, 2,155 cycles · capped-domain metrics · source: reproducible evaluation reports</text>
