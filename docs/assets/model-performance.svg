  <text x="565" y="222" text-anchor="middle" fill="#40379b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">13.96</text>

  <text x="281" y="521" text-anchor="middle" fill="#42413e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Validation</text>
