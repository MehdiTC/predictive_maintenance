<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TurbineGuard champion model performance</title>
  <desc id="desc">Validation and held-out replay MAE and RMSE bars, plus held-out interval coverage, critical-alert recall, mean alert lead time, and the official NASA final-row benchmark RMSE.</desc>
  <rect width="1200" height="630" rx="20" fill="#fbfaf7"/>

  <text x="52" y="58" fill="#171717" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Champion model performance</text>
  <text x="52" y="87" fill="#686762" font-family="system-ui, sans-serif" font-size="15">Ridge regression · capped RUL target · public NASA C-MAPSS FD001 simulation</text>

  <rect x="42" y="116" width="674" height="446" rx="16" fill="#ffffff" stroke="#d7d5ce"/>
  <text x="70" y="153" fill="#171717" font-family="system-ui, sans-serif" font-size="18" font-weight="650">RUL error by evaluation role</text>
  <text x="70" y="177" fill="#77756f" font-family="system-ui, sans-serif" font-size="13">Cycles · lower is better · every operating cycle scored</text>

